<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>scotty — Interactive phone</title>
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0;width:100%;height:100%;background:#050d14;color:#edf7ff;font-family:system-ui,sans-serif; }
    body { display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#173449 0,transparent 50%),linear-gradient(#050d14,#0c1b29); }
    .live-space {position:fixed;inset:0;overflow:hidden;pointer-events:none;}
    .space-glow {position:absolute;inset:-25%;background:radial-gradient(ellipse at 20% 30%,#1676a143,transparent 45%),radial-gradient(ellipse at 80% 70%,#315e8c55,transparent 40%);animation:space-breathe 32s ease-in-out infinite alternate;}
    .stars {position:absolute;inset:-100px;background-image:radial-gradient(circle at 20% 22%,#e5f6ff 0 1px,transparent 1.8px),radial-gradient(circle at 75% 34%,#8ce0ff 0 1px,transparent 1.8px),radial-gradient(circle at 32% 72%,#ffffffa6 0 .7px,transparent 1.5px),radial-gradient(circle at 58% 18%,#ffffff73 0 .7px,transparent 1.4px);background-size:223px 251px,317px 289px,163px 193px,397px 347px;animation:stellar-drift 80s linear infinite alternate;}
    .stars.far {opacity:.35;background-size:137px 149px,193px 211px,283px 173px,353px 257px;animation-duration:130s;animation-direction:alternate-reverse;}
    .orbit {position:absolute;width:74vw;height:74vw;left:-36vw;top:10vh;border:1px solid #8ce0ff18;border-radius:50%;box-shadow:0 0 90px #8ce0ff08;transform:rotate(-25deg) scaleY(.6);}
    .orbit:after {content:'';position:absolute;inset:15%;border:1px solid #8ce0ff14;border-radius:50%;}
    @keyframes stellar-drift {from{transform:translate3d(-35px,20px,0)}to{transform:translate3d(65px,-65px,0)}}
    @keyframes space-breathe {from{transform:translate3d(-3%,0,0) scale(1);opacity:.65}to{transform:translate3d(3%,-3%,0) scale(1.08);opacity:1}}
    .phone-stage {position:fixed;left:50%;top:calc(var(--viewport-height,100dvh)/2);width:390px;height:800px;transform:translate(-50%,-50%) scale(var(--phone-scale,1));transform-origin:center;}
    .phone-stage::after {content:'';position:absolute;left:8%;right:8%;bottom:-30px;height:22px;border-radius:50%;background:#0007;filter:blur(14px);animation:float-shadow 7s ease-in-out infinite;pointer-events:none;}
    @keyframes phone-float {0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
    @keyframes float-shadow {0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.04);opacity:.55}}
    @media(prefers-reduced-motion:reduce){.stars,.space-glow,.phone,.phone-stage::after{animation:none!important;}}
    .phone { width:390px;height:800px;position:relative;padding:12px;border-radius:54px;background:linear-gradient(125deg,#75828d 0,#26333e 2%,#080d12 5%,#293844 94%,#87939c 98%,#27313a 100%);box-shadow:0 40px 90px #000a,inset 0 0 0 2px #7a889466;animation:phone-float 7s ease-in-out infinite; }
    .screen { height:100%;border-radius:43px;overflow:hidden;background:#040b12;position:relative;border:2px solid #000; }
    .status {height:37px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:650;background:#040b12;}
    .island {position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:25px;border-radius:30px;background:#000;z-index:2;box-shadow:inset 0 0 0 1px #ffffff0c;}
    .island:after {content:'';position:absolute;right:12px;top:8px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#233c5a,#080b10);}
    iframe {display:block;width:100%;height:calc(100% - 37px);border:0;background:#040b12;}
    .power,.volume {position:absolute;background:linear-gradient(90deg,#667682,#1a232d);width:4px;border-radius:3px;}
    .power {right:-3px;top:178px;height:75px;}.volume {left:-3px;top:160px;height:48px;}.volume.second {top:220px;}
    .battery {display:inline-block;width:19px;height:9px;border:1px solid #bccad5;border-radius:3px;padding:1px;vertical-align:middle;margin-left:5px;}.battery:after {content:'';display:block;width:90%;height:100%;background:#edf7ff;border-radius:1px;}
    .home {position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:105px;height:4px;background:#edf7ff99;border-radius:3px;pointer-events:none;}
    .hint {position:fixed;bottom:8px;font-size:12px;color:#b8cadc;text-align:center;margin:0 12px;}
    @media(max-width:450px){.hint{display:none;}}
    .team-credit {position:fixed;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;margin:0;text-align:center;color:#ddbf83;font-size:14px;z-index:3;pointer-events:none;}
  </style>
</head>
<body>
  <p class="team-credit">Ally, Max, Brooke</p>
  <div class="live-space" aria-hidden="true"><div class="space-glow"></div><div class="stars far"></div><div class="stars"></div><div class="orbit"></div></div>
  <div class="phone-stage"><div class="phone" aria-label="Interactive Scotty phone preview">
    <span class="power" aria-hidden="true"></span><span class="volume" aria-hidden="true"></span><span class="volume second" aria-hidden="true"></span>
    <div class="screen">
      <div class="status" aria-hidden="true"><span>9:41</span><span>5G <span class="battery"></span></span></div>
      <div class="island" aria-hidden="true"></div>
      <iframe src="./" title="Working Scotty app" allow="clipboard-write; web-share"></iframe>
      <div class="home" aria-hidden="true"></div>
    </div>
  </div></div>
  <p class="hint">Live interactive app · Scroll, choose a route, and book with demo credits</p>
  <script>
    function fitPhone() {
      const height=visualViewport ? visualViewport.height : innerHeight;
      const width=visualViewport ? visualViewport.width : innerWidth;
      document.documentElement.style.setProperty('--viewport-height',height+'px');
      document.documentElement.style.setProperty('--phone-scale',Math.max(.1,Math.min(1,(width-48)/390,(height-128)/800)));
    }
    fitPhone(); addEventListener('resize',fitPhone);
    if(visualViewport)visualViewport.addEventListener('resize',fitPhone);
  </script>
</body>
</html>
