<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCOTTY Presentation — Beam me up, Scotty.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020910;color:white;font-family:Arial,sans-serif}.video-shell{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:#020910}.space{position:absolute;inset:-6%;z-index:-3;background:url('nebula.webp') center/cover;animation:drift 32s ease-in-out infinite alternate}.vignette{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#02091055,#020910b8),radial-gradient(ellipse at center,transparent 15%,#020910b8 100%)}.content{min-height:100svh;display:grid;place-items:center;text-align:center;padding:100px 24px 120px}.panel{max-width:930px;padding:40px 50px;border-radius:22px;background:#070f1440;backdrop-filter:blur(4px);border:1px solid #ffffff1f}.brand{font-size:12px;letter-spacing:.42em;color:#e8c88f;margin:0 0 30px}h1{font-size:clamp(3.1rem,7.4vw,7rem);line-height:.98;margin:0;letter-spacing:-.055em;font-weight:500}.gold{color:#f0c26d}.subtitle{margin:24px 0 30px;font-size:clamp(1rem,2vw,1.5rem);line-height:1.5;color:#ffffffcc}button,a{font:inherit}button{padding:14px 23px;border:1px solid #ffffff40;border-radius:999px;background:#0a101473;color:white;cursor:pointer;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid #84c8f4;outline-offset:5px}.primary{background:#edc780;color:#142432;border-color:#edc780}.secondary{color:#c0d9e8;display:inline-block;margin-left:20px;text-underline-offset:5px}.controls{position:absolute;bottom:28px;right:28px;display:flex;gap:12px}.credit{position:absolute;bottom:33px;left:28px;font-size:11px;color:#b7cad3}.screening{position:fixed;inset:0;z-index:10;background:#020910;display:flex;flex-direction:column;padding:16px;gap:10px}.screening[hidden]{display:none}.screening video{width:100%;min-height:0;flex:1;object-fit:contain;background:#000}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:13px;color:#b8cbd7}.toolbar button{padding:9px 18px}.toolbar a{color:#edc780}.error{color:#f0c26d}@keyframes drift{to{transform:scale(1.08) translate(2%,-1%)}}@media(prefers-reduced-motion:reduce){.space{animation:none}}.motion-paused .space{animation-play-state:paused}@media(max-width:600px){.panel{padding:34px 22px}.content{padding:60px 18px 150px}h1{font-size:clamp(3rem,12vw,4.3rem)}.secondary{display:block;margin:20px 0 0}.controls{bottom:64px;right:18px;left:18px;justify-content:center}.credit{left:18px;right:18px;bottom:18px;text-align:center;font-size:10px}.toolbar{flex-wrap:wrap}}
</style><link rel="stylesheet" href="scotty-typography.css"></head>
<body><main class="video-shell"><div class="space" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div class="content"><div class="panel"><p class="brand">SCOTTY / PRODUCT WALKTHROUGH</p><h1>Beam me up,<br><span class="gold">Scotty.</span></h1><p class="subtitle">Your ship. Your rocket bus. Your daily ride.</p><button class="primary" id="watch">Watch the walkthrough →</button><a class="secondary" href="./?skip=1">Explore the app</a></div></div><div class="controls"><button id="motion" aria-pressed="false">Pause background</button><button id="fullscreen">Full screen</button></div><div class="credit">UI/UX class assignment · Fictional transport experience</div></main>
<section class="screening" id="screening" aria-label="SCOTTY video walkthrough" hidden><div class="toolbar"><button id="back">← Back to title</button><span>SCOTTY / HOW IT WORKS</span><a href="SCOTTY-Presentation.webm" download>Download video</a></div><video id="walkthrough" controls playsinline preload="metadata" poster="scotty-presentation-poster.png"><source src="SCOTTY-Presentation.webm" type="video/webm"></video><span id="playback-status" role="status"></span></section>
<script>
const video=document.getElementById('walkthrough'),screening=document.getElementById('screening'),status=document.getElementById('playback-status');document.getElementById('watch').onclick=async()=>{screening.hidden=false;video.focus();try{await video.play()}catch(e){status.textContent='Press the video play button to begin.'}};document.getElementById('back').onclick=()=>{video.pause();screening.hidden=true;document.getElementById('watch').focus()};document.getElementById('motion').onclick=e=>{const paused=document.body.classList.toggle('motion-paused');e.currentTarget.setAttribute('aria-pressed',paused);e.currentTarget.textContent=paused?'Resume background':'Pause background'};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){status.textContent='Use your browser full-screen control.'}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!screening.hidden)document.getElementById('back').click()});video.addEventListener('error',()=>{status.textContent='Video unavailable. Keep SCOTTY-Presentation.webm beside this page.'});
</script></body></html>
